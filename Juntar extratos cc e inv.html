<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinador de Extratos BB</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            color: #0f172a;
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        p.desc {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 25px 0;
            line-height: 1.5;
        }
        .upload-area {
            border: 3px dashed #cbd5e1;
            background: #f8fafc;
            padding: 40px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .upload-area p {
            margin: 0;
            color: #1e40af;
            font-weight: 600;
            font-size: 16px;
        }
        #fileInput {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #2563eb;
            font-weight: 500;
            display: none;
            background: #e0f2fe;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }
        .lista-projetos {
            margin-top: 25px;
            display: none;
        }
        .lista-projetos h3 {
            font-size: 16px;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .item-projeto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 10px;
            gap: 15px;
        }
        .nome-projeto {
            font-weight: 600;
            color: #0f172a;
        }
        .arquivos-par {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
            line-height: 1.4;
        }
        .acoes-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-end;
        }
        .btn-baixar {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .btn-baixar:hover {
            background: #16a34a;
        }
        .btn-adicionar {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        .btn-adicionar:hover {
            background: #d97706;
        }
        .btn-baixar-todos {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            margin-top: 15px;
            display: none;
        }
        .btn-baixar-todos:hover {
            background: #2563eb;
        }
        .texto-alerta {
            color: #dc2626;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>&#128450;&#65039; Combinador de Extratos BB (CC + INV)</h1>
    <p class="desc">Selecione todos os arquivos de uma vez. O sistema vai extrair o número de identificação final, agrupar os pares e gerar o PDF final.</p>

    <div class="upload-area">
        <p>&#128194; Arraste ou clique para selecionar TODOS os PDFs do Banco do Brasil</p>
        <input type="file" id="fileInput" accept=".pdf" multiple="">
    </div>

    <div id="status"></div>

    <div id="listaProjetosSection" class="lista-projetos">
        <h3>Pares de Extratos Identificados:</h3>
        <div id="containerItens"></div>
        <button id="btnBaixarTodos" class="btn-baixar-todos" onclick="baixarTodosOsPares()">&#128229; Baixar Todos os PDFs Combinados</button>
    </div>
</div>

<input type="file" id="inputFaltante" accept=".pdf" style="display: none;">

<script>
    let mapProjetos = {};
    let idEmEdicao = null;
    let tipoEmEdicao = null;

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const files = e.target.files;
        if (files.length === 0) return;

        mostrarStatus(`Lendo ${files.length} arquivos... Cruzando códigos de conta...`);
        mapProjetos = {}; 

        for (let i = 0; i < files.length; i++) {
            let file = files[i];
            processarArquivoIndividual(file, i);
        }

        renderizarListaProjetos();
    });

    function processarArquivoIndividual(file, index = 0) {
        let nomeOriginal = file.name;
        let nomeSemExtensao = nomeOriginal.replace(/\.pdf$/i, '');
        let nomeMinusculo = nomeSemExtensao.toLowerCase();

        let numerosNoNome = nomeMinusculo.match(/\d+/);
        let IDProjeto = numerosNoNome ? numerosNoNome[0] : nomeSemExtensao.replace(/banco do brasil|cc|inv|\s+/gi, '');

        if (!IDProjeto) IDProjeto = "Sem_Codigo_" + index;

        if (!mapProjetos[IDProjeto]) {
            mapProjetos[IDProjeto] = { cc: null, inv: null };
        }

        if (nomeMinusculo.includes('cc') || nomeMinusculo.includes('conta')) {
            mapProjetos[IDProjeto].cc = file;
        } else if (nomeMinusculo.includes('inv') || nomeMinusculo.includes('aplic') || nomeMinusculo.includes('invest')) {
            mapProjetos[IDProjeto].inv = file;
        } else {
            if (!mapProjetos[IDProjeto].cc) mapProjetos[IDProjeto].cc = file;
            else mapProjetos[IDProjeto].inv = file;
        }
    }

    function renderizarListaProjetos() {
        const container = document.getElementById('containerItens');
        container.innerHTML = "";
        let temProjetos = false;

        for (let id in mapProjetos) {
            let par = mapProjetos[id];
            if (!par.cc && !par.inv) continue;
            temProjetos = true;

            let itemDiv = document.createElement('div');
            itemDiv.className = "item-projeto";

            let rotuloCC = par.cc ? par.cc.name : '<span class="texto-alerta">&#10060; Faltando arquivo CC</span>';
            let rotuloINV = par.inv ? par.inv.name : '<span class="texto-alerta">&#10060; Faltando arquivo INV</span>';

            let botaoDesabilitado = (!par.cc || !par.inv) ? 'disabled style="background:#cbd5e1; cursor:not-allowed;"' : '';

            let btnAddCC = !par.cc ? `<button class="btn-adicionar" onclick="solicitarArquivoFaltante('${id}', 'cc')">+ Adicionar CC</button>` : '';
            let btnAddINV = !par.inv ? `<button class="btn-adicionar" onclick="solicitarArquivoFaltante('${id}', 'inv')">+ Adicionar INV</button>` : '';

            itemDiv.innerHTML = `
                <div>
                    <div class="nome-projeto">&#128273; Conta / ID: ${id}</div>
                    <div class="arquivos-par">
                        1º (Frente): ${rotuloCC} ${btnAddCC}<br> 
                        2º (Verso): ${rotuloINV} ${btnAddINV}
                    </div>
                </div>
                <div class="acoes-container">
                    <button class="btn-baixar" ${botaoDesabilitado} onclick="processarEBaixarUmPar('${id}')">Juntar e Baixar</button>
                </div>
            `;
            container.appendChild(itemDiv);
        }

        document.getElementById('status').style.display = 'none';
        document.getElementById('listaProjetosSection').style.display = 'block';
        if (temProjetos) {
            document.getElementById('btnBaixarTodos').style.display = 'block';
        }
    }

    function solicitarArquivoFaltante(id, tipo) {
        idEmEdicao = id;
        tipoEmEdicao = tipo;
        document.getElementById('inputFaltante').click();
    }

    document.getElementById('inputFaltante').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file && idEmEdicao && tipoEmEdicao) {
            mapProjetos[idEmEdicao][tipoEmEdicao] = file;
            renderizarListaProjetos();
        }
        this.value = ''; // Limpa o input para poder carregar novamente se necessário
    });

    async function mesclarPDFs(fileCC, fileINV) {
        const { PDFDocument } = PDFLib;
        const pdfCombinado = await PDFDocument.create();

        // O parâmetro ignoreEncryption evita falhas em PDFs do BB com restrições
        const options = { ignoreEncryption: true };

        // 1. Processa CC
        const arrayCC = await fileCC.arrayBuffer();
        const docCC = await PDFDocument.load(arrayCC, options);
        const paginasCC = await pdfCombinado.copyPages(docCC, docCC.getPageIndices());
        paginasCC.forEach(pag => pdfCombinado.addPage(pag));

        // 2. Processa INV
        const arrayINV = await fileINV.arrayBuffer();
        const docINV = await PDFDocument.load(arrayINV, options);
        const paginasINV = await pdfCombinado.copyPages(docINV, docINV.getPageIndices());
        paginasINV.forEach(pag => pdfCombinado.addPage(pag));

        const pdfBytes = await pdfCombinado.save();
        return pdfBytes;
    }

    async function processarEBaixarUmPar(id) {
        let par = mapProjetos[id];
        if (!par.cc || !par.inv) return;

        try {
            let bytes = await mesclarPDFs(par.cc, par.inv);
            dispararDownload(bytes, `Extrato_Combinado_Conta_${id}.pdf`);
        } catch (error) {
            alert(`Erro ao juntar os arquivos da conta ${id}. Verifique o console do navegador para mais detalhes.`);
            console.error(error);
        }
    }

    async function baixarTodosOsPares() {
        mostrarStatus("Baixando todos os arquivos combinados... Verifique os downloads do seu navegador.");
        
        for (let id in mapProjetos) {
            let par = mapProjetos[id];
            if (par.cc && par.inv) {
                await processarEBaixarUmPar(id);
                await new Promise(resolve => setTimeout(resolve, 400));
            }
        }
        document.getElementById('status').style.display = 'none';
    }

    function dispararDownload(bytes, nomeArquivo) {
        const blob = new Blob([bytes], { type: "application/pdf" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = nomeArquivo;
        link.click();
        URL.revokeObjectURL(link.href);
    }

    function mostrarStatus(msg) {
        const s = document.getElementById('status');
        s.innerText = msg;
        s.style.display = 'block';
    }
</script>

</body>
</html>
