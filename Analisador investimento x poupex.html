<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Extratos - Poupex vs Investimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-emerald-400">Verificador de Extratos</h1>
      <p class="text-slate-400 text-sm">Faça upload dos PDFs para identificar o tipo e extrair os meses.</p>
    </header>

    <!-- Configurações e Upload -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4 shadow-lg">
      <div class="flex flex-col sm:flex-row gap-4 items-center justify-between border-b border-slate-700 pb-4">
        <label class="text-sm font-medium text-slate-300">Tipo esperado para validação:</label>
        <select id="expectedType" onchange="reprocess()" class="bg-slate-900 text-slate-200 px-4 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-500">
          <option value="INVESTIMENTO">Investimento (Correto)</option>
          <option value="POUPEX">Poupex / Poupança (Correto)</option>
        </select>
      </div>

      <div class="border-2 border-dashed border-slate-600 hover:border-emerald-500 transition-colors rounded-xl p-8 text-center cursor-pointer relative bg-slate-900/50" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" multiple accept=".pdf,.txt" class="hidden" onchange="handleFiles(this.files)">
        <div class="space-y-2">
          <svg class="mx-auto h-12 w-12 text-slate-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h24a4 4 0 004-4V20L28 8z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="text-slate-300 font-medium">Clique para selecionar os extratos (PDF)</p>
          <p class="text-xs text-slate-500">Suporta múltiplos arquivos simultâneos</p>
        </div>
      </div>
    </div>

    <!-- Status de Processamento -->
    <div id="status" class="hidden text-center text-sm font-medium text-emerald-400 animate-pulse">
      Processando arquivos, aguarde...
    </div>

    <!-- Listas de Resultados -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Meses Incorretos / Errados -->
      <div class="bg-slate-800 p-5 rounded-xl border border-red-500/30 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-700 pb-2">
          <h2 class="font-bold text-red-400 flex items-center gap-2">
            <span>❌</span> Meses Incorretos
          </h2>
          <button onclick="copyList('wrong')" class="bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs px-3 py-1.5 rounded-md border border-red-500/30 transition-colors">
            Copiar Lista
          </button>
        </div>
        <textarea id="wrongListText" class="w-full h-48 bg-slate-900 text-slate-200 text-sm p-3 rounded-lg border border-slate-700 focus:outline-none font-mono resize-none" readonly placeholder="Nenhum mês incorreto encontrado..."></textarea>
      </div>

      <!-- Meses Corretos -->
      <div class="bg-slate-800 p-5 rounded-xl border border-emerald-500/30 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-700 pb-2">
          <h2 class="font-bold text-emerald-400 flex items-center gap-2">
            <span>✅</span> Meses Corretos
          </h2>
          <button onclick="copyList('correct')" class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 text-xs px-3 py-1.5 rounded-md border border-emerald-500/30 transition-colors">
            Copiar Lista
          </button>
        </div>
        <textarea id="correctListText" class="w-full h-48 bg-slate-900 text-slate-200 text-sm p-3 rounded-lg border border-slate-700 focus:outline-none font-mono resize-none" readonly placeholder="Nenhum mês correto encontrado..."></textarea>
      </div>

    </div>
  </div>

  <script>
    // Configuração segura do worker do PDF.js
    if (window['pdfjs-dist/build/pdf']) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let processedData = [];

    const monthNames = {
      "JAN": "Janeiro", "FEV": "Fevereiro", "MAR": "Março",
      "ABR": "Abril", "MAI": "Maio", "JUN": "Junho",
      "JUL": "Julho", "AGO": "Agosto", "SET": "Setembro",
      "OUT": "Outubro", "NOV": "Novembro", "DEZ": "Dezembro"
    };

    async function handleFiles(files) {
      if (!files.length) return;
      
      const status = document.getElementById('status');
      status.classList.remove('hidden');
      processedData = [];

      for (let file of files) {
        try {
          let text = "";
          if (file.type === "application/pdf" || file.name.endsWith('.pdf')) {
            text = await extractPdfText(file);
          } else {
            text = await file.text();
          }

          const detectedType = detectType(text);
          const monthYear = extractMonthYear(text, file.name);

          processedData.push({
            filename: file.name,
            monthYear: monthYear,
            type: detectedType
          });
        } catch (e) {
          console.error("Erro ao ler arquivo: ", file.name, e);
          // Fallback caso falha a leitura interna do PDF
          const monthYear = extractMonthYear("", file.name);
          processedData.push({
            filename: file.name,
            monthYear: monthYear,
            type: "INVESTIMENTO"
          });
        }
      }

      status.classList.add('hidden');
      renderResults();
    }

    async function extractPdfText(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const tokenProps = await page.getTextContent();
        const pageText = tokenProps.items.map(item => item.str).join(" ");
        fullText += pageText + " ";
      }
      return fullText;
    }

    function detectType(text) {
      const upper = text.toUpperCase();
      if (upper.includes("POUPEX") || upper.includes("POUPANÇA")) {
        return "POUPEX";
      }
      return "INVESTIMENTO";
    }

    function extractMonthYear(text, filename) {
      const cleanName = filename.toUpperCase();
      
      // Procura por siglas de meses no nome do arquivo (ex: ABR 2025 ou ABR2025)
      for (let key in monthNames) {
        const reg = new RegExp(`${key}\\s*(\\d{4})`);
        const match = cleanName.match(reg);
        if (match) {
          return `${monthNames[key]}/${match[1]}`;
        }
      }

      // Procura formato MM/AAAA ou MM-AAAA no texto ou nome
      const dateMatch = (text + " " + filename).match(/(\d{2})[\/\-](\d{4})/);
      if (dateMatch) {
        const m = parseInt(dateMatch[1], 10);
        const y = dateMatch[2];
        const keys = Object.keys(monthNames);
        if (m >= 1 && m <= 12) {
          return `${monthNames[keys[m - 1]]}/${y}`;
        }
      }

      return "Mês Não Identificado";
    }

    function renderResults() {
      const expected = document.getElementById('expectedType').value;
      
      const correct = [];
      const wrong = [];

      processedData.forEach(item => {
        if (item.type === expected) {
          correct.push(item.monthYear);
        } else {
          wrong.push(item.monthYear);
        }
      });

      document.getElementById('correctListText').value = correct.join('\n');
      document.getElementById('wrongListText').value = wrong.join('\n');
    }

    function reprocess() {
      if (processedData.length > 0) {
        renderResults();
      }
    }

    function copyList(type) {
      const id = type === 'correct' ? 'correctListText' : 'wrongListText';
      const textarea = document.getElementById(id);
      
      if (!textarea.value.trim()) return;

      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      alert('Lista copiada para a área de transferência!');
    }
  </script>
</body>
</html>
